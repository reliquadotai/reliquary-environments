[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reliquary-general"
version = "0.1.0a1"
description = "General-purpose and tool-use prompts for distilling a chat model, in contiguous segments by block and thinking mode"
readme = "README.md"
license = "MIT AND Apache-2.0 AND CC-BY-4.0 AND ODC-By-1.0"
license-files = ["LICENSE", "NOTICE", "reliquary_general/_ifeval/LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "verifiers==0.3.1",
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.1,<7",
  "huggingface-hub>=0.25",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["reliquary_general"]

[tool.hatch.build.targets.sdist]
exclude = ["scripts/build/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.uv]
required-version = ">=0.11.1"

[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "b2e4e8157783b2c0dffc7821044c87f29f1c3ccf" }
