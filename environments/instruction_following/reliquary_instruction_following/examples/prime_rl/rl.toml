# Two-GPU reference run: one training GPU and one inference GPU.
max_steps = 100
# Room for the 8,192-token budget environment.toml declares, plus its prompt.
seq_len = 16384
dashboard = false

[deployment]
type = "single_node"
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
# For a reproducible run, override this with the revision-pinned local snapshot
# from README.md. Prime-RL v0.9.0 has no model-revision config field.
name = "Qwen/Qwen3-4B-Instruct-2507"

[ckpt]
interval = 5
keep_last = 3
keep_interval = 15

[weight_broadcast]
type = "filesystem"

[monitors.file]

[trainer.model]
impl = "auto"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.optim]
type = "adamw"
lr = 1e-5
weight_decay = 0.0

[orchestrator]
batch_size = 32
group_size = 16
max_off_policy_steps = 8

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
# Set explicitly: left to auto-resolution a model outside the renderer map
# falls back to the default renderer, which has no tool support.
name = "qwen3"
# Mirrors [policy] reasoning in environment.toml. A Qwen3.5 model needs the
# "qwen35" renderer instead; the template differs.
enable_thinking = false

[orchestrator.train]
filter_zero_advantages = true

[orchestrator.train.sampling]
temperature = 1.0
# The reply is the answer, and the corpus asks for several paragraphs of it.
# A budget that truncates mid-answer does not produce a near miss: it breaks
# whichever constraint speaks about the end of the text, and the group learns
# from a length accident rather than from the instruction.
max_completion_tokens = 8192

[[orchestrator.train.source]]
name = "reliquary-instruction-following-train"
env.taskset.id = "reliquary-instruction-following"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "docker"
env.agent.runtime.allow = []
env.agent.max_turns = 1

[orchestrator.train.source.curriculum.gates.zero_signal]
type = "advantage_range"
reject_min = 0.0
reject_max = 0.0

[orchestrator.eval]
interval = 15
num_examples = 48
group_size = 16
skip_first_step = false

[orchestrator.eval.sampling]
temperature = 1.0
top_p = 1.0
max_completion_tokens = 8192

[[orchestrator.eval.source]]
name = "reliquary-instruction-following-eval"
env.taskset.id = "reliquary-instruction-following"
env.taskset.split = "eval"
env.agent.harness.id = "null"
env.agent.runtime.type = "docker"
env.agent.runtime.allow = []
env.agent.max_turns = 1

[inference]

[inference.vllm]
dtype = "bfloat16"
max_model_len = 16384
seed = 0
gpu_memory_utilization = 0.9
enable_lora = true
max_lora_rank = 32
