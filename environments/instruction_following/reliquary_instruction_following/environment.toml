schema = "reliquary/environment-source/v2"
id = "reliquary/instruction-following"
version = "0.1.0a1"
taskset = "reliquary-instruction-following"
entrypoint = "reliquary_instruction_following:InstructionFollowingTaskset"
compatibility_entrypoint = "reliquary_instruction_following:InstructionFollowingEnvironment"
license = "MIT"
verification_tier = "deterministic-replay"
owners = ["Reliquary contributors"]
task_families = [
  "change_case",
  "combination",
  "copy",
  "count",
  "detectable_content",
  "detectable_format",
  "first_word",
  "keywords",
  "last_word",
  "length_constraints",
  "letters",
  "paragraphs",
  "punctuation",
  "startend",
]

[compatibility]
python = ">=3.12,<3.13"
verifiers = ">=0.3.1,<0.4"
verifiers_api = "v1"

[execution]
network = false
secrets = []
resource_class = "cpu"
max_turns = 1
max_observation_bytes = 16384

[reward]
minimum = 0.0
maximum = 1.0
components = ["all_constraints_followed"]

[data]
train = "nemotron-if-rl:v1:train"
eval = "nemotron-if-rl:v1:eval"
qualification = "nemotron-if-rl:v1:qualification"
redistributable = true
license = "odc-by"
# Shipped in the wheel rather than fetched: the corpus is the task, and a row
# that arrived differently is a different environment. The digest covers the
# decompressed body of `data/prompts.jsonl.gz`.
source = "nvidia/Nemotron-Cascade-2-RL-data"
source_split = "IF-RL"
source_url = "https://huggingface.co/datasets/nvidia/Nemotron-Cascade-2-RL-data"
rows = 37196
sha256 = "d685f4a7f435931538bc800d4b34a977c445949fc15fdc1c6b8b65bd9ac08093"

[provenance]
source_repository = "https://github.com/reliquadotai/reliquary-environments"
upstream = "https://github.com/allenai/open-instruct"
upstream_path = "open_instruct/IFEvalG"
upstream_license = "Apache-2.0"
port = "vendored-checkers"

[policy]
# How the policy should be prompted. The environment knows whether its task
# rewards deliberation; the harness running it does not.
reasoning = "direct"
reasoning_rationale = """
Flipped from thinking on the matched comparison the two published positions
never ran. Nemotron-Cascade 1 runs this stage directly; Cascade 2 reverses it
with deliberation on and no numbers for the difference. The first version of
this file chose thinking and said to flip it if the evidence appeared. It did:

  same 48 prompts, same policy, 16 rollouts, graded identically
  thinking   10.2% solved,  4.2% of groups carry gradient, 1,274 words
  direct     21.5% solved, 37.5% of groups carry gradient,   242 words

The cause is specific to how this environment grades, not to deliberation as
such. Every verifier reads the whole completion — there is no answer span to
extract — so under thinking it checks a thousand words of reasoning against
constraints written for the answer: all lowercase, no commas, an exact number
of paragraphs. A policy that closed its reasoning block cleanly would not pay
this, and the comparison should be rerun on one; the policy measured here
never closes it, in 0 of 3,072 rollouts across three environments.

The sibling that grades a world instead of a string goes the other way:
telecom-solo scores 28.1% band thinking and 25.0% direct, because what the
model writes there never reaches the grade. Deliberation costs only where the
grader reads it.
"""
# What the task needs in order to be measured at all, rather than what a
# harness happens to allow.
max_new_tokens = 8192
max_new_tokens_rationale = """
Measured direct, 48 prompts, 16 rollouts. The longest completion that ended on
its own ran to 3,364 words, about 4,500 tokens, and the median is 214. The
8.9% that reach the ceiling are loops rather than long answers — nothing that
finishes comes near it — so a higher ceiling would buy room for degeneracy
and nothing else.
"""
