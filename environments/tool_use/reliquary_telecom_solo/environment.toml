schema = "reliquary/environment-source/v2"
id = "reliquary/telecom-solo"
version = "0.1.0a1"
taskset = "reliquary-telecom-solo"
entrypoint = "reliquary_telecom_solo:TelecomSoloTaskset"
compatibility_entrypoint = "reliquary_telecom_solo:TelecomSoloEnvironment"
license = "MIT"
verification_tier = "deterministic-replay"
owners = ["Reliquary contributors"]
task_families = ["mms_issue", "mobile_data_issue", "service_issue"]

[compatibility]
python = ">=3.12,<3.13"
verifiers = ">=0.3.1,<0.4"
verifiers_api = "v1"

[execution]
network = false
secrets = []
resource_class = "cpu"
# The longest reference solution is 12 calls and the 95th percentile is 9; with
# the stop call that is a floor of 13 for an agent that already knows the
# answer. The rest is diagnosis, which the workflow policy prescribes as a
# sequence of reads before any change. 40 leaves room for three passes.
max_turns = 40
# The widest observation a tool can return is a customer's twelve bills with
# their line items, measured at 1,572 bytes. 8 KiB is comfortable headroom and
# still small enough that a runaway tool result is caught rather than paid for.
max_observation_bytes = 8192

[reward]
minimum = 0.0
maximum = 1.0
components = ["env_assertions", "actions"]

[data]
train = "tau2-telecom:v1:train"
eval = "tau2-telecom:v1:eval"
qualification = "tau2-telecom:v1:qualification"
redistributable = true
license = "MIT"
# Shipped in the wheel rather than fetched. The tickets, the starting databases
# and the policy are all the task: a ticket that arrived differently is a
# different problem at the same index. The digest covers the decompressed body
# of `data/tasks.json.gz`, which is `tasks_full.json` byte for byte.
source = "sierra-research/tau2-bench"
source_path = "data/tau2/domains/telecom/tasks_full.json"
source_url = "https://github.com/sierra-research/tau2-bench"
rows = 2285
sha256 = "37e562e1ae3242577407e1303b1548bc64e7ea68e37d36173e6747990ceaf8a4"
db_sha256 = "562d647ef9d7df8df91eafd8ee76036e707c8f9e32aaedc4a7fde06975aea2c0"
user_db_sha256 = "4886107ea0c16f8e16d74bef91cfb557de61822afe9361f5a9b241806aea2e4c"
main_policy_sha256 = "781296ae5419169cb64aac0c4fa2aa6129c78f3c1592f64abd80df6fbabb7042"
workflow_policy_sha256 = "b174d1f9705b5d7df49468daf99560a5633f86d23e10499a1166a7753706a412"
tool_schemas_sha256 = "92124e2900cbdc2820c4944494d8146daf862b73cd37a66365c51ae61d9276d9"

[provenance]
source_repository = "https://github.com/reliquadotai/reliquary-environments"
upstream = "https://github.com/sierra-research/tau2-bench"
upstream_path = "src/tau2/domains/telecom"
upstream_license = "MIT"
port = "solo-mode-vendored"

[policy]
# How the policy should be prompted. The environment knows whether its task
# rewards deliberation; the harness running it does not.
reasoning = "thinking"
reasoning_rationale = """
Twenty dependent steps against a device database, with a twenty-kilobyte
troubleshooting manual to hold in working memory.

Measured, not only argued. Same 32 tickets, same policy, 16 episodes each:
thinking reaches a 28.1% band and ends 49% of episodes by calling `done`;
direct reaches 25.0% and ends only 30% that way, looping to the forty-turn
limit eight times as often. Without deliberation the policy acts more — 27
calls against 21 — and plans less.

This is the opposite of what instruction-following measured, and the
difference is what each one grades. That environment reads the whole
completion, so reasoning is judged against constraints written for the
answer. This one reads the device and the carrier's records after the last
call, so nothing the model writes reaches the grade — deliberation is free
here, and it helps.
"""
# What the task needs in order to be measured at all, rather than what a
# harness happens to allow. Per TURN: this is an episode, and each turn is one
# generation ending in a tool call.
max_new_tokens = 4096
max_new_tokens_rationale = """
Measured per turn over 11,308 turns with the ceiling raised to 16,384 so that
nothing stopped at the old cap. Median 223 tokens, p99 2,001. The fraction of
turns a ceiling would cut:

   2,048   0.93%
   4,096   0.14%
   8,192   0.11%
  16,384   0.11%

Everything above 4,096 buys three hundredths of a percent, and the twelve
turns that reach 16,384 are loops that would reach any ceiling. Of 244
episodes ending on an invalid action, 12 had their last turn cut; the rest
chose prose over a call, which is a behaviour and not a budget.

A whole episode generates 8,068 tokens at the median, 22,494 at p99 and
24,324 at most, which is the figure an episode-level cap has to clear.
"""
