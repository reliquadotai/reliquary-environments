[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliquary-envscaler"
version = "0.1.0a1"
description = "EnvScaler's tool-interactive worlds as a verifiable Reliquary environment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["verifiers>=0.3.1,<0.4", "huggingface-hub>=0.30"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["reliquary_envscaler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.uv]
required-version = ">=0.11.1"
