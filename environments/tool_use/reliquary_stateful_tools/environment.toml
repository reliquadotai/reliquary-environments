schema = "reliquary/environment-source/v2"
id = "reliquary/stateful-tools"
version = "0.1.0a1"
taskset = "reliquary-stateful-tools"
entrypoint = "reliquary_stateful_tools:StatefulToolsTaskset"
compatibility_entrypoint = "reliquary_stateful_tools:StatefulToolsEnvironment"
license = "MIT"
verification_tier = "deterministic-replay"
owners = ["Reliquary contributors"]
task_families = ["address_update", "refund", "support_note"]

[compatibility]
python = ">=3.12,<3.13"
verifiers = ">=0.3.1,<0.4"
