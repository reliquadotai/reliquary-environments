[reward]
minimum = 0.0
maximum = 1.0
components = ["state_invariants", "completion"]

[data]
train = "procedural:reliquary-stateful-tools-generator-v2:train"
eval = "procedural:reliquary-stateful-tools-generator-v2:eval"
qualification = "procedural:reliquary-stateful-tools-generator-v2:qualification"
redistributable = true
license = "MIT"

[provenance]
source_repository = "https://github.com/reliquadotai/reliquary"
source_commit = "656c86227b7cd5a96676c3e88e31412ababf464c"
source_environment = "reliquary_stateful_tools_v1"
port = "new-v2-identity"
