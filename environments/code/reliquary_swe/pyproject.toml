[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reliquary-swe"
version = "0.1.0a1"
description = "SWE-bench Verified repair tasks, graded by running the target repository's own tests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "verifiers==0.3.1",
  "datasets>=2.19",
  # Pinned to the 3.x line deliberately, not just at its latest patch: 4.0.0+
  # moved to a "task repo" model where swebench needs an `image`/`log_parser`/
  # `eval_script` already computed on the instance, which the raw
  # SWE-bench_Verified rows this package loads do not carry. 3.x still exposes
  # the (repo, version) -> spec API (`MAP_REPO_VERSION_TO_SPECS`) our corpus
  # shape matches (see reliquary_swe/swe_adapter.py's module docstring).
  "swebench==3.0.17",
  # The only module importing this is swesmith_adapter.py, same pattern as
  # swebench above: wrap a second library behind names we own rather than
  # reinvent its per-repo test-command/log-parser knowledge (see that
  # module's docstring). `swesmith`'s own PyPI package declares no required
  # dependencies at all -- everything is behind extras -- so the four it
  # actually needs to import (`swesmith.profiles`) are pinned individually
  # rather than pulling an extra ("generate"/"validate"/"all") that also
  # drags in tree-sitter, litellm, modal and friends this package never uses.
  "swesmith==0.0.9",
  "docker>=7,<8",
  "ghapi>=1,<2",
  "python-dotenv>=1,<2",
  "unidiff>=0.7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.21.0"]

[tool.hatch.build.targets.wheel]
packages = ["reliquary_swe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
asyncio_mode = "auto"
markers = [
  # Needs a real Docker daemon and pulled swebench images; run on the
  # container host, never on this repo's dev machine (see remote-test).
  "docker: tests that provision a Docker container",
  # Runs a full instance's test suite inside a container (tens of seconds
  # or more); deselect with `-m "not slow"` to keep the routine loop quick.
  "slow: tests that run for longer than a routine test loop should wait",
]

[tool.uv]
required-version = ">=0.11.1"

[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "b2e4e8157783b2c0dffc7821044c87f29f1c3ccf" }
