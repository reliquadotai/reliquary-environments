schema = "reliquary/environment-source/v2"
id = "reliquary/terminal"
version = "0.3.0"
taskset = "reliquary-terminal"
entrypoint = "reliquary_terminal:TerminalTaskset"
license = "MIT"
verification_tier = "container-reverified"
owners = ["Reliquary contributors"]
task_families = ["terminal_bench_2_1", "mimo_terminal", "tmax"]

# No `compatibility_entrypoint`: Verifiers-only, like reliquary-swe -- a
# container cannot be replayed deterministically.

[compatibility]
python = ">=3.12,<3.13"
verifiers = ">=0.3.1,<0.4"
verifiers_api = "v1"

[execution]
# True because `eval` needs it: it keeps Terminal-Bench 2.1's own policy,
# which lets all 89 tasks reach the internet. `train` runs with no network
# at all, agent box and grading box alike, as its rows declare
# (`allow_internet = false` on all 64) -- checked by tests/test_taskset.py.
network = true
secrets = []
resource_class = "container"
# Provisional and unmeasured, borrowed from reliquary-swe's own provisional
# 40; to be re-derived from a pilot's observed trajectory lengths.
max_turns = 40
max_observation_bytes = 16384
# Seconds one `bash` call may run before its process group is killed and the
# agent told (`--env.agent.harness.command-timeout`, harness `reliquary-terminal`).
# Measured on the 2026-10-02 qualification traces: 2,120 terminal commands
# (Qwen3-4B, Qwen3.8-27B), longest 10 s, p99 2.9 s -- 180 is 18x that. The
# upstream `bash` harness allows 3,600, and one `grep` over a whole tree used
# 1,489 of them in the same run's reliquary-swe rollouts.
command_timeout_seconds = 180

[reward]
minimum = 0.0
maximum = 1.0
# Each task's own `tests/test.sh` writes the verdict; `HarborTask.solved`
# reads it.
components = ["solved"]

[policy]
reasoning = "thinking"
reasoning_rationale = """
Every task is a diagnosis in an unfamiliar tree -- a vendored project, a
broken repository, a service to configure -- before the first command that
changes anything, and the shell is the only other place reasoning can go.
An argument, not a measurement, as for reliquary-swe: to be rewritten with a
measured band after a first pilot.
"""

[data]
# Evaluation: Terminal-Bench 2.1, pinned by content digest (revision 6 on
# the Harbor registry at the time of pinning). Never trained on.
eval = "harbor:terminal-bench/terminal-bench-2-1@sha256:7d7bdc1cbedad549fc1140404bd4dc45e5fd0ea7c4186773687d177ad3a0699a"
rows = 89
# Training: the Terminal-Bench-format rows of MiMo-V2.6-RL-oss's `general`
# config, with images under `xiaomimimo/mimo-v2.6-rl-oss:general-agent-env-<n>`
# (about 0.3 GB compressed each, ~20 GB for all 64).
train = "hf:XiaomiMiMo/MiMo-V2.6-RL-oss/general@639865fd3374018d6cb29b9fb82dd531406fcf5f"
train_rows = 64
redistributable = true
license = "Terminal-Bench: Apache-2.0; MiMo-V2.6-RL-oss: Apache-2.0 per its dataset card; vendored project trees inherit their own licenses; TMax-15K: ODC-BY, with Gemini outputs under Google's terms (only task ids are committed here)"
# A second training corpus, `--taskset.split tmax`: TMax-15K's Apptainer
# tasks, converted to run on one shared base image (`tmax_base/`) and graded
# in a fresh box that receives /app and /home/user (docs/tmax.md). Which
# tasks are kept is `reliquary_terminal/tmax_manifest.json`. Of 14,601, the
# static stage excludes 8,636 (8,407 have no successful recorded run) and
# the box phase (scripts/tmax_validate.py, 2026-10-05/08) 975 more: 4,990
# are kept. They come in two disjoint parts, `--taskset.split tmax_sft`
# (2,401, the SFT corpus job) and `tmax_rl` (2,589, RL); `tmax` is both.
# The base image is pinned by the local id it was validated on: it is not in
# a registry yet (docs/tmax.md, "What is left").
tmax = "hf:allenai/TMax-15K@e3ded940596cc611c9815684ba51a7e8ee0cffc9"
tmax_rows = 4990
