name: ci

on:
  pull_request:
  push:

jobs:
  stateful-tools:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/tool_use/reliquary_stateful_tools
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv pip install 'verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b2e4e8157783b2c0dffc7821044c87f29f1c3ccf'
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync validate reliquary-stateful-tools -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl
      - run: uv pip install --python .wheel-venv/bin/python --no-deps 'verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b2e4e8157783b2c0dffc7821044c87f29f1c3ccf'
      - run: .wheel-venv/bin/python ../../../scripts/check_verifiers_pin.py
      - name: Verify installed wheel and packaged golden
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/tool_use/reliquary_stateful_tools/.wheel-venv/bin/python -c "import hashlib,importlib.resources,json; import verifiers.v1 as vf; from reliquary_stateful_tools import StatefulToolsEnvironment; root=importlib.resources.files('reliquary_stateful_tools'); artifact=json.loads(root.joinpath('artifact.json').read_text()); assert all(hashlib.sha256(root.parent.joinpath(name).read_bytes()).hexdigest()==digest for name,digest in artifact['files'].items()); assert len(root.joinpath('goldens/reference.jsonl').read_text().splitlines())==3; assert len(StatefulToolsEnvironment())==1<<31; config=vf.taskset_config_type('reliquary-stateful-tools'); assert len(list(vf.load_taskset(config(id='reliquary-stateful-tools')).head(3)))==3"
      - name: Validate installed wheel
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/tool_use/reliquary_stateful_tools/.wheel-venv/bin/validate reliquary-stateful-tools -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false

  reliquary-logic:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/reasoning/reliquary_logic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run pytest
      - run: uv run validate reliquary-logic -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_logic-0.1.0a1-py3-none-any.whl
      - run: uv pip install --python .wheel-venv/bin/python --no-deps 'verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b2e4e8157783b2c0dffc7821044c87f29f1c3ccf'
      - run: .wheel-venv/bin/python ../../../scripts/check_verifiers_pin.py
      - name: Verify installed wheel and packaged golden
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/reasoning/reliquary_logic/.wheel-venv/bin/python -c "import hashlib,importlib.resources,json; import verifiers.v1 as vf; from reliquary_logic import LogicEnvironment; from reliquary_logic.taskset import TASK_COUNT; root=importlib.resources.files('reliquary_logic'); artifact=json.loads(root.joinpath('artifact.json').read_text()); assert all(hashlib.sha256(root.parent.joinpath(name).read_bytes()).hexdigest()==digest for name,digest in artifact['files'].items()); assert len(root.joinpath('goldens/reference.jsonl').read_text().splitlines())==3; assert len(LogicEnvironment())==TASK_COUNT; e=LogicEnvironment(); assert e.grade(0, e.reference_completion(0))['reward']==1.0; config=vf.taskset_config_type('reliquary-logic'); assert len(list(vf.load_taskset(config(id='reliquary-logic')).head(3)))==3"
      - name: Validate installed wheel
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/reasoning/reliquary_logic/.wheel-venv/bin/validate reliquary-logic -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false

  prime-rl-v0-9:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PrimeIntellect-ai/prime-rl
          ref: ab5de8fff44b2c4a5c85e24b6e6e3f7d57eee7b1
          path: .prime-rl
          submodules: recursive
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify upstream pin
        run: |
          test "$(git -C .prime-rl rev-parse HEAD)" = "ab5de8fff44b2c4a5c85e24b6e6e3f7d57eee7b1"
          test "$(git -C .prime-rl/deps/verifiers rev-parse HEAD)" = "b2e4e8157783b2c0dffc7821044c87f29f1c3ccf"
          test "$(git -C .prime-rl/deps/renderers rev-parse HEAD)" = "cb8243913702367878427c7a7094b350ea1a8e20"
          test "$(git -C .prime-rl/deps/pydantic-config rev-parse HEAD)" = "65b15dffba82d4be19efdaf8b2b9705cc1756be8"
          test "$(git -C .prime-rl/deps/prime-envs rev-parse HEAD)" = "26dafdc9582576975ec576f893be7319028daf51"
      - name: Install pinned Prime-RL
        working-directory: .prime-rl
        run: uv sync --frozen --package prime-rl --no-dev
      - name: Install pinned environment wheel
        run: |
          curl -fsSL "https://github.com/reliquadotai/reliquary-environments/releases/download/v0.1.0a1/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl" -o "${{ runner.temp }}/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl"
          echo "f4d5480e57e66265faa78c53e36fa8ab781afe0ae907d7dc5749d2b0f9344155  ${{ runner.temp }}/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl" | sha256sum -c -
          uv pip install --python .prime-rl/.venv/bin/python --no-deps "${{ runner.temp }}/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl"
      - name: Load environment through pinned Verifiers
        run: .prime-rl/.venv/bin/python -c "import verifiers.v1 as vf; c=vf.taskset_config_type('reliquary-stateful-tools'); t=vf.load_taskset(c(id='reliquary-stateful-tools', split='train')); assert len(list(t.head(3))) == 3"
      - name: Build the reviewed Logic wheel twice from this source
        run: uv run --no-project --python 3.12 python scripts/build_logic_release.py --output "${{ runner.temp }}/logic-release"
      - name: Install the reviewed Logic wheel
        run: uv pip install --python .prime-rl/.venv/bin/python --no-deps "${{ runner.temp }}/logic-release/"*.whl
      - name: Load both environments through pinned Verifiers
        run: |
          .prime-rl/.venv/bin/python -c "import verifiers.v1 as vf; c=vf.taskset_config_type('reliquary-logic'); t=vf.load_taskset(c(id='reliquary-logic', split='train')); assert len(list(t.head(3))) == 3"
      - name: Validate Prime-RL config
        run: .prime-rl/.venv/bin/rl @ "$GITHUB_WORKSPACE/environments/tool_use/reliquary_stateful_tools/examples/prime_rl/rl.toml" --dry-run True --output-dir "${{ runner.temp }}/prime-output" --run.name reliquary-prime-compatibility
      - name: Validate the logic Prime-RL config
        run: .prime-rl/.venv/bin/rl @ "$GITHUB_WORKSPACE/environments/reasoning/reliquary_logic/examples/prime_rl/rl.toml" --dry-run True --output-dir "${{ runner.temp }}/prime-output-logic" --run.name reliquary-logic-prime-compatibility
