name: ci

on:
  pull_request:
  push:

jobs:
  stateful-tools:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/tool_use/reliquary_stateful_tools
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv pip install 'verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b2e4e8157783b2c0dffc7821044c87f29f1c3ccf'
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync validate reliquary-stateful-tools -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl
      - run: uv pip install --python .wheel-venv/bin/python --no-deps 'verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b2e4e8157783b2c0dffc7821044c87f29f1c3ccf'
      - run: .wheel-venv/bin/python ../../../scripts/check_verifiers_pin.py
      - name: Verify installed wheel and packaged golden
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/tool_use/reliquary_stateful_tools/.wheel-venv/bin/python -c "import hashlib,importlib.resources,json; import verifiers.v1 as vf; from reliquary_stateful_tools import StatefulToolsEnvironment; root=importlib.resources.files('reliquary_stateful_tools'); artifact=json.loads(root.joinpath('artifact.json').read_text()); assert all(hashlib.sha256(root.parent.joinpath(name).read_bytes()).hexdigest()==digest for name,digest in artifact['files'].items()); assert len(root.joinpath('goldens/reference.jsonl').read_text().splitlines())==3; assert len(StatefulToolsEnvironment())==1<<31; config=vf.taskset_config_type('reliquary-stateful-tools'); assert len(list(vf.load_taskset(config(id='reliquary-stateful-tools')).head(3)))==3"
      - name: Validate installed wheel
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/tool_use/reliquary_stateful_tools/.wheel-venv/bin/validate reliquary-stateful-tools -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false

  reliquary-logic:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/reasoning/reliquary_logic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      - run: uv run pytest
      - run: uv run validate reliquary-logic -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_logic-0.1.0a1-py3-none-any.whl
      - run: uv pip install --python .wheel-venv/bin/python --no-deps 'verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b2e4e8157783b2c0dffc7821044c87f29f1c3ccf'
      - run: .wheel-venv/bin/python ../../../scripts/check_verifiers_pin.py
      - name: Verify installed wheel and packaged golden
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/reasoning/reliquary_logic/.wheel-venv/bin/python -c "import hashlib,importlib.resources,json; import verifiers.v1 as vf; from reliquary_logic import LogicEnvironment; from reliquary_logic.taskset import TASK_COUNT; root=importlib.resources.files('reliquary_logic'); artifact=json.loads(root.joinpath('artifact.json').read_text()); assert all(hashlib.sha256(root.parent.joinpath(name).read_bytes()).hexdigest()==digest for name,digest in artifact['files'].items()); assert len(root.joinpath('goldens/reference.jsonl').read_text().splitlines())==3; assert len(LogicEnvironment())==TASK_COUNT; e=LogicEnvironment(); assert e.grade(0, e.reference_completion(0))['reward']==1.0; config=vf.taskset_config_type('reliquary-logic'); assert len(list(vf.load_taskset(config(id='reliquary-logic')).head(3)))==3"
      - name: Validate installed wheel
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/reasoning/reliquary_logic/.wheel-venv/bin/validate reliquary-logic -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false

  telecom-solo:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/tool_use/reliquary_telecom_solo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync validate reliquary-telecom-solo -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_telecom_solo-0.1.0a1-py3-none-any.whl
      - run: uv pip install --python .wheel-venv/bin/python --no-deps 'verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@b2e4e8157783b2c0dffc7821044c87f29f1c3ccf'
      - run: .wheel-venv/bin/python ../../../scripts/check_verifiers_pin.py
      - name: Verify installed wheel and packaged golden
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/tool_use/reliquary_telecom_solo/.wheel-venv/bin/python -c "import hashlib,importlib.resources,json; import verifiers.v1 as vf; from reliquary_telecom_solo import TelecomSoloEnvironment; root=importlib.resources.files('reliquary_telecom_solo'); artifact=json.loads(root.joinpath('artifact.json').read_text()); assert all(hashlib.sha256(root.parent.joinpath(name).read_bytes()).hexdigest()==digest for name,digest in artifact['files'].items()); assert len(root.joinpath('goldens/reference.jsonl').read_text().splitlines())==11; e=TelecomSoloEnvironment('qualification'); assert len(e)==230; assert e.replay(0, e.reference_actions(0))['reward']['reward']==1.0; assert e.replay(0, [])['reward']['reward']==0.0; config=vf.taskset_config_type('reliquary-telecom-solo'); assert len(list(vf.load_taskset(config(id='reliquary-telecom-solo')).head(3)))==3"

  reliquary-envscaler:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/tool_use/reliquary_envscaler
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      - run: uv run pytest
      - run: uv run validate reliquary-envscaler -n 2 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear

  prime-rl-v0-9:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PrimeIntellect-ai/prime-rl
          ref: ab5de8fff44b2c4a5c85e24b6e6e3f7d57eee7b1
          path: .prime-rl
          submodules: recursive
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify upstream pin
        run: |
          test "$(git -C .prime-rl rev-parse HEAD)" = "ab5de8fff44b2c4a5c85e24b6e6e3f7d57eee7b1"
          test "$(git -C .prime-rl/deps/verifiers rev-parse HEAD)" = "b2e4e8157783b2c0dffc7821044c87f29f1c3ccf"
          test "$(git -C .prime-rl/deps/renderers rev-parse HEAD)" = "cb8243913702367878427c7a7094b350ea1a8e20"
          test "$(git -C .prime-rl/deps/pydantic-config rev-parse HEAD)" = "65b15dffba82d4be19efdaf8b2b9705cc1756be8"
          test "$(git -C .prime-rl/deps/prime-envs rev-parse HEAD)" = "26dafdc9582576975ec576f893be7319028daf51"
      - name: Install pinned Prime-RL
        working-directory: .prime-rl
        run: uv sync --frozen --package prime-rl --no-dev
      - name: Install pinned environment wheel
        run: |
          curl -fsSL "https://github.com/reliquadotai/reliquary-environments/releases/download/v0.1.0a1/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl" -o "${{ runner.temp }}/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl"
          echo "f4d5480e57e66265faa78c53e36fa8ab781afe0ae907d7dc5749d2b0f9344155  ${{ runner.temp }}/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl" | sha256sum -c -
          uv pip install --python .prime-rl/.venv/bin/python --no-deps "${{ runner.temp }}/reliquary_stateful_tools-0.1.0a1-py3-none-any.whl"
      - name: Load environment through pinned Verifiers
        run: .prime-rl/.venv/bin/python -c "import verifiers.v1 as vf; c=vf.taskset_config_type('reliquary-stateful-tools'); t=vf.load_taskset(c(id='reliquary-stateful-tools', split='train')); assert len(list(t.head(3))) == 3"
      - name: Build the reviewed Logic wheel twice from this source
        run: uv run --no-project --python 3.12 python scripts/build_logic_release.py --output "${{ runner.temp }}/logic-release"
      - name: Install the reviewed Logic wheel
        run: uv pip install --python .prime-rl/.venv/bin/python --no-deps "${{ runner.temp }}/logic-release/"*.whl
      - name: Load both environments through pinned Verifiers
        run: |
          .prime-rl/.venv/bin/python -c "import verifiers.v1 as vf; c=vf.taskset_config_type('reliquary-logic'); t=vf.load_taskset(c(id='reliquary-logic', split='train')); assert len(list(t.head(3))) == 3"
      - name: Validate Prime-RL config
        run: .prime-rl/.venv/bin/rl @ "$GITHUB_WORKSPACE/environments/tool_use/reliquary_stateful_tools/examples/prime_rl/rl.toml" --dry-run True --output-dir "${{ runner.temp }}/prime-output" --run.name reliquary-prime-compatibility
      - name: Validate the logic Prime-RL config
        run: .prime-rl/.venv/bin/rl @ "$GITHUB_WORKSPACE/environments/reasoning/reliquary_logic/examples/prime_rl/rl.toml" --dry-run True --output-dir "${{ runner.temp }}/prime-output-logic" --run.name reliquary-logic-prime-compatibility

  instruction-following:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/instruction_following/reliquary_instruction_following
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      - run: uv run --no-sync pytest
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_instruction_following-0.1.0a1-py3-none-any.whl
      - name: Verify installed wheel and packaged goldens
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/instruction_following/reliquary_instruction_following/.wheel-venv/bin/python $GITHUB_WORKSPACE/environments/instruction_following/reliquary_instruction_following/scripts/verify_wheel.py

  dapo-math:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/reasoning/reliquary_dapo_math
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync validate reliquary-dapo-math -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_dapo_math-0.1.0a1-py3-none-any.whl
      - name: Verify installed wheel and packaged goldens
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/reasoning/reliquary_dapo_math/.wheel-venv/bin/python $GITHUB_WORKSPACE/environments/reasoning/reliquary_dapo_math/scripts/verify_wheel.py

  reliquary-code:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/code/reliquary_code
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync validate reliquary-code -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear
      - run: uv venv --python 3.12 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/reliquary_code-0.1.0a2-py3-none-any.whl
      - name: Verify installed wheel outside its source tree
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/environments/code/reliquary_code/.wheel-venv/bin/python $GITHUB_WORKSPACE/environments/code/reliquary_code/scripts/verify_wheel.py

  reliquary-swe:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/code/reliquary_swe
    steps:
      # The docker tests now pull, on top of the SWE-bench images budgeted
      # below, the two polyglot goldens' images (~3.4 GB on disk) and the
      # SWE-smith golden's (~3.9 GB) -- past the runner's 14 GB. The first
      # run that reached them lost its runner. Preinstalled toolchains this
      # job never uses are removed first to make room.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # test_corpus.py's own review noted this job would re-download
      # princeton-nlp/SWE-bench_Verified from the HF Hub on every push
      # (Task 1's own deferred follow-up). Measured locally: the pinned
      # revision's cache is ~7.5 MB extracted -- negligible against this
      # job's own ~4.9 GB of measured headroom below -- so this is a cache,
      # not a disk-budget risk. Keyed on the pin itself: a revision bump
      # invalidates it automatically rather than serving a stale corpus.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: swe-bench-verified-c104f840cc67f8b6eec6f759ebc8b2693d585d4a
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      # `-m "not slow"` deselects exactly four tests, all @docker, each a
      # whole-repository-suite run: three run django's entire 12,311-test
      # suite (test_patch touches only .txt fixtures, so a genuine restored
      # run falls back to everything, ~226s each) and one runs xarray's
      # 1,818 tests (~300s) --
      #   test_adapter.py::test_grading_django_end_to_end_is_not_actually_broken
      #   test_adapter.py::test_grading_a_large_instance_end_to_end_gets_a_real_result
      #   test_goldens.py::test_a_patch_that_rewrites_djangos_test_runner_scores_zero
      #   test_goldens.py::test_a_patch_that_rewrites_djangos_settings_module_scores_zero
      # ~15 minutes combined, plus django's and xarray's own multi-gigabyte
      # images (neither is otherwise provisioned by any non-slow test --
      # confirmed by grepping which tests use the django_runtime/xarray
      # fixtures). Stated, not silent: every other @docker test still runs,
      # including the controls proving network isolation, test-tampering
      # resistance, and infra-raises-not-scores. The four excluded tests
      # remain part of the routine suite against the dedicated container
      # host via .superpowers/sdd/2026-09-22-reliquary-swe/remote-test
      # (789s / 63 passed for the full, undeselected suite).
      #
      # Disk budget, measured on the container host, not guessed: ubuntu-22.04
      # has 14 GB SSD (github/docs data/reusables/actions/supported-github-runners.md).
      # After the exclusion above, this job pulls exactly 4 SWE-bench images
      # -- astropy-12907 + sphinx-8595 here, astropy-13033 + astropy-13236 in
      # the validate step below (the corpus's first 3 rows are all
      # astropy/astropy). Measured for real: removed every swebench image on
      # the host, pulled these 4 in this exact order, diffed `df
      # /var/lib/docker` after each pull -- +3.74, +1.75, +2.89, +0.16 =
      # 8.54 GB total (the small last add is real layer sharing between
      # astropy-13033/13236's images, confirmed via matching `docker inspect
      # --format '{{.RootFS.Layers}}'` digests; the naive sum of `docker
      # images` sizes, 11.48 GB, overstates this by ~3 GB). Repo checkout +
      # this package's .venv + `uv build`'s dist/ add another ~0.6 GB
      # (14.6 MB tracked tree + 17 MB .git + 555 MB venv + 100 KB dist,
      # measured locally). Total ~9.1 GB against 14 GB: ~4.9 GB of real
      # headroom. Re-measure if the images this job pulls change (a new
      # golden instance, a corpus revision).
      - run: uv run --no-sync pytest -m "not slow"
      - run: uv run --no-sync validate reliquary-swe -n 3 --only-gold true --runtime.type docker --runtime.allow '[]' --rich false
      - run: uv build --clear

  reliquary-terminal:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: environments/code/reliquary_terminal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python ../../../scripts/check_verifiers_pin.py
      - run: uv run --no-sync python ../../../scripts/check_reasoning_mode.py
      - run: uv run --no-sync python ../../../scripts/check_example_matches_policy.py
      # The @docker goldens pull two small images: alexgshaw/fix-git and
      # xiaomimimo/mimo-v2.6-rl-oss:general-agent-env-1 (~0.3 GB compressed).
      - run: uv run --no-sync pytest
      - run: uv build --clear
