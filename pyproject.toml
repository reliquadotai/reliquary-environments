[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reliquary-environments-tools"
version = "0.1.0"
description = "Tools for building environment packages"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]

[tool.uv]
required-version = ">=0.11.1"
